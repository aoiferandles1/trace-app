<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trace Timeline A2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid #14163A;outline-offset:2px}
</style>
</helmet>
<div id="top" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F7F7FB; color: #14163A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<p style="margin: 0; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; color: #5B6085; border-bottom: 1px solid #E4E6F2">Demo with sample data</p>

<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto">
<header style="flex: none; height: 56px; display: flex; align-items: center; gap: 12px">
<a href="RecordA2.dc.html" aria-label="Back to Record" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-left: -6px; color: #14163A"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; font-family: Sora, Inter, sans-serif; font-weight: 300; font-size: 28px; line-height: 34px; letter-spacing: -0.01em">Timeline</h1>
</header>
<div role="radiogroup" aria-label="Show" style="flex: none; display: flex; gap: 4px; padding: 4px; background: #FFFFFF; border: 1px solid #DCDFF0; border-radius: 18px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{f.checked}}" onClick="{{f.pick}}" style="flex: 1; height: 40px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</sc-for>
</div>
<div style="flex: none; background: #FFFFFF; border: 1px solid #E1E4F2; border-radius: 24px; padding: 4px 18px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<button type="button" onClick="{{r.open}}" style="display: grid; grid-template-columns: 52px 1fr 20px; align-items: center; width: 100%; box-sizing: border-box; min-height: 60px; padding: 8px 0; border: 0; border-bottom: 1px solid {{r.divider}}; background: transparent; font: inherit; color: #14163A; text-align: left; cursor: pointer">
<span style="font-family: Sora, Inter, sans-serif; font-weight: 300; font-size: 20px; line-height: 26px; color: {{r.yearColor}}">{{r.year}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 22px; font-weight: 500">{{r.title}}</span><span style="font-size: 14px; line-height: 20px; color: #5B6085">{{r.sub}}</span></span>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>
</sc-for>
</div>
</main>
<nav aria-label="Main" style="flex: none; height: 68px; display: flex; align-items: center; border-top: 1px solid #E4E6F2; background: #FFFFFF">
<a href="MainA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
Home
</a>
<a href="RecordA2.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; font-size: 12px; line-height: 16px; font-weight: 600; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
Record
</a>
<a href="#top" aria-label="Add" style="flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none">
<span style="width: 48px; height: 48px; border-radius: 24px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
</a>
<a href="MedsA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/><path d="M8.5 8.5l7 7"/></svg>
Medications
</a>
<a href="InsuranceA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.8-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
Profile
</a>
</nav>

<sc-if value="{{sheetOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(20,22,58,0.45)" aria-hidden="true"></div>
<section role="dialog" aria-label="{{sTitle}}" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 640px; overflow-y: auto; box-sizing: border-box; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #DCDFF0"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-family: Sora, Inter, sans-serif; font-weight: 300; font-size: 26px; line-height: 32px">{{sTitle}}</h2><span style="font-size: 14px; line-height: 20px; color: #5B6085">{{sMeta}}</span></div>
<button type="button" aria-label="Close" onClick="{{close}}" style="flex: none; width: 36px; height: 36px; border: 0; background: transparent; color: #5B6085; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; line-height: 16px; color: #5B6085">Seen by</span><span style="font-size: 16px; line-height: 24px">{{sBy}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; line-height: 16px; color: #5B6085">Outcome</span><span style="font-size: 16px; line-height: 24px">{{sOutcome}}</span></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; line-height: 16px; color: #5B6085">Prescribed</span>
<sc-for list="{{sRx}}" as="r" hint-placeholder-count="2"><span style="display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 22px; font-weight: 500">{{r.name}}</span><span style="font-size: 14px; line-height: 20px; color: #5B6085">{{r.detail}}</span></span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; line-height: 16px; color: #5B6085">Doctor's notes</span><span style="font-size: 16px; line-height: 24px">{{sNotes}}</span></div>
</section>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5468D4","options":["#5468D4","#4353C4","#6B5BD6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all', sel: '' }; }
  renderVals() {
    const accent = this.props.accent ?? '#5468D4';
    const entries = [
      { id: 'e1', year: '2026', mon: 'Aug', title: 'Chest infection', type: 'Infection', by: 'Dr Hennessy, Rathmines Medical Centre', outcome: 'Resolved', rx: [['Doxycycline 100mg', '7 days, from 2 Aug']], notes: 'Cough and fever for five days. Chest clear at follow-up.' },
      { id: 'e2', year: '2026', mon: 'Feb', title: 'Asthma flare', type: 'Condition', by: 'Dr Hennessy, Rathmines Medical Centre', outcome: 'Settled', rx: [['Prednisolone 20mg', '5 days'], ['Salbutamol 100mcg', 'As needed']], notes: 'Wheeze after a cold. Peak flow improved on treatment.' },
      { id: 'e3', year: '2025', mon: 'Sep', title: 'Urinary tract infection', type: 'Infection', by: 'Dr Hennessy, Rathmines Medical Centre', outcome: 'Resolved', rx: [['Nitrofurantoin 100mg', '5 days']], notes: 'Penicillin allergy noted, so a non-penicillin antibiotic was used.' },
      { id: 'e4', year: '2024', mon: 'Apr', title: 'Hay fever', type: 'Condition', by: 'Dr Hennessy, Rathmines Medical Centre', outcome: 'Seasonal', rx: [['Cetirizine 10mg', 'April to September']], notes: 'Itchy eyes and sneezing each spring.' },
      { id: 'e5', year: '2023', mon: 'Nov', title: 'Tonsillitis', type: 'Infection', by: 'Dr Hennessy, Rathmines Medical Centre', outcome: 'Resolved', rx: [['Clarithromycin 250mg', '7 days']], notes: 'Sore throat and fever. Non-penicillin antibiotic because of the allergy.' },
      { id: 'e6', year: '2022', mon: 'Mar', title: 'Hypothyroidism diagnosed', type: 'Condition', by: 'Dr Walsh, Endocrinology', outcome: 'Ongoing', rx: [['Levothyroxine 25mcg', 'Raised to 50mcg in Sep 2022']], notes: 'Found on blood tests after months of tiredness.' },
      { id: 'e7', year: '2020', mon: 'Dec', title: 'Covid-19', type: 'Infection', by: 'Dr Hennessy, Rathmines Medical Centre', outcome: 'Resolved', rx: [['Nothing prescribed', 'Rest and fluids']], notes: 'Managed at home. No hospital stay.' },
      { id: 'e8', year: '2019', mon: 'Jun', title: 'Atrial fibrillation diagnosed', type: 'Condition', by: "Dr O'Mahony, Cardiology, Mater Private", outcome: 'Ongoing', rx: [['Warfarin 5mg', 'Daily, ongoing']], notes: 'Irregular heartbeat picked up on an ECG.' },
      { id: 'e9', year: '2018', mon: 'Feb', title: 'Glandular fever', type: 'Infection', by: 'Dr Hennessy, Rathmines Medical Centre', outcome: 'Resolved', rx: [['Nothing prescribed', 'Rest and fluids']], notes: 'Sore throat and exhaustion for several weeks.' }
    ];
    const f = this.state.filter;
    const filters = [['all', 'All'], ['infection', 'Infections'], ['condition', 'Conditions']].map((d) => {
      const on = f === d[0];
      return { label: d[1], checked: on, bg: on ? accent : 'transparent', fg: on ? '#FFFFFF' : '#4A4F7A', pick: () => this.setState({ filter: d[0] }) };
    });
    const list = entries.filter((e) => f === 'all' || e.type.toLowerCase() === f);
    const rows = list.map((e, i) => ({
      year: (i === 0 || list[i - 1].year !== e.year) ? e.year : '',
      yearColor: e.year === '2026' ? accent : '#14163A',
      title: e.title, sub: e.mon + ', ' + e.type,
      divider: i === list.length - 1 ? 'transparent' : '#ECEEF8',
      open: () => this.setState({ sel: e.id })
    }));
    const s = entries.find((e) => e.id === this.state.sel);
    const out = {
      accent: accent, filters: filters, rows: rows, sheetOpen: !!s,
      close: () => this.setState({ sel: '' })
    };
    const e = s || entries[0];
    out.sTitle = e.title; out.sMeta = e.mon + ' ' + e.year + ', ' + e.type; out.sBy = e.by; out.sOutcome = e.outcome;
    out.sRx = e.rx.map((r) => ({ name: r[0], detail: r[1] })); out.sNotes = e.notes;
    return out;
  }
}
</script>
</body>
</html>
