<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trace Insurance A2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid #14163A;outline-offset:2px}
</style>
</helmet>
<div id="top" style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7FB; color: #14163A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<p style="margin: 0; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; color: #5B6085; border-bottom: 1px solid #E4E6F2">Demo with sample data</p>

<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 20px; display: flex; flex-direction: column; gap: 16px">

<header style="flex: none; height: 56px; display: flex; align-items: center; gap: 12px">
<a href="MainA2.dc.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin-left: -6px; color: #14163A">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin: 0; font-family: Sora, Inter, sans-serif; font-weight: 300; font-size: 24px; line-height: 30px; letter-spacing: -0.01em">Insurance</h1>
</header>

<sc-if value="{{choosing}}" hint-placeholder-val="{{ true }}">
<div style="flex: none; display: flex; flex-direction: column; gap: 16px">

<p style="margin: 0; font-size: 15px; line-height: 22px; color: #5B6085">Choose your provider and sign in with them. Trace never sees your password.</p>

<div style="background: #FFFFFF; border: 1px solid #E1E4F2; border-radius: 24px; padding: 2px 18px">
<sc-for list="{{providers}}" as="p" hint-placeholder-count="4">
<button type="button" onClick="{{p.pick}}" style="display: flex; align-items: center; justify-content: space-between; width: 100%; box-sizing: border-box; height: 60px; padding: 0; border: 0; border-bottom: 1px solid {{p.divider}}; background: transparent; font: inherit; color: #14163A; text-align: left; cursor: pointer">
<span style="font-size: 16px; line-height: 22px; font-weight: 500">{{p.name}}</span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>
</sc-for>
</div>

<a href="#top" style="align-self: flex-start; color: {{accent}}; font-size: 15px; font-weight: 600; line-height: 22px; text-decoration: none">Enter policy details manually</a>

<p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #5B6085">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
Read only. You can disconnect any time.
</p>

</div>
</sc-if>

<sc-if value="{{connected}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; display: flex; flex-direction: column; gap: 16px">

<div style="background: {{accent}}; color: #FFFFFF; border-radius: 28px; padding: 22px 22px 20px; display: flex; flex-direction: column; gap: 22px">
<span style="font-size: 13px; line-height: 16px; font-weight: 500; opacity: .8">Connected</span>
<span style="font-family: Sora, Inter, sans-serif; font-weight: 300; font-size: 28px; line-height: 34px; letter-spacing: -0.01em">{{provider}}</span>
<span style="display: flex; align-items: flex-end; justify-content: space-between">
<span style="display: flex; flex-direction: column"><span style="font-size: 13px; line-height: 16px; opacity: .8">Member number</span><span style="font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .08em">•••• 4821</span></span>
<span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 13px; line-height: 16px; opacity: .8">Comprehensive plan</span><span style="font-size: 14px; line-height: 20px; font-weight: 500">Renews 1 Mar 2027</span></span>
</span>
</div>

<button type="button" role="switch" aria-checked="{{shareOn}}" onClick="{{toggleShare}}" style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; min-height: 64px; padding: 0 18px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E1E4F2; font: inherit; color: #14163A; text-align: left; cursor: pointer">
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 22px; font-weight: 500">Include in shares</span><span style="font-size: 14px; line-height: 20px; color: #5B6085">Helpful for hospital stays</span></span>
<span style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: {{shareBg}}; border: 2px solid {{shareBorder}}">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{shareCheck}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</span>
</button>

<button type="button" onClick="{{disconnect}}" style="align-self: flex-start; height: 44px; padding: 0; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: #A12A1E; cursor: pointer">Disconnect</button>

</div>
</sc-if>

</main>

<nav aria-label="Main" style="flex: none; height: 68px; display: flex; align-items: center; border-top: 1px solid #E4E6F2; background: #FFFFFF">
<a href="MainA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
Home
</a>
<a href="RecordA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
Record
</a>
<a href="#top" aria-label="Add" style="flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none">
<span style="width: 48px; height: 48px; border-radius: 24px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
</a>
<a href="MedsA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/><path d="M8.5 8.5l7 7"/></svg>
Medications
</a>
<a href="#top" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; font-size: 12px; line-height: 16px; font-weight: 600; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.8-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
Profile
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5468D4","options":["#5468D4","#4353C4","#6B5BD6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 'choose', provider: '', share: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#5468D4';
    const names = ['VHI', 'Laya Healthcare', 'Irish Life Health', 'Other provider'];
    const providers = names.map((n, i) => ({
      name: n,
      divider: i === names.length - 1 ? 'transparent' : '#ECEEF8',
      pick: () => this.setState({ stage: 'connected', provider: n, share: false })
    }));
    const on = this.state.share;
    return {
      accent: accent,
      choosing: this.state.stage === 'choose',
      connected: this.state.stage === 'connected',
      providers: providers,
      provider: this.state.provider,
      shareOn: on,
      shareBg: on ? accent : '#FFFFFF',
      shareBorder: on ? accent : '#9096BE',
      shareCheck: on ? '#FFFFFF' : 'transparent',
      toggleShare: () => this.setState({ share: !this.state.share }),
      disconnect: () => this.setState({ stage: 'choose', provider: '', share: false })
    };
  }
}
</script>
</body>
</html>
