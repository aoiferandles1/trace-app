<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trace Medications A2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,button:focus-visible{outline:2px solid #14163A;outline-offset:2px}
</style>
</helmet>
<div id="top" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #F7F7FB; color: #14163A; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<p style="margin: 0; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 16px; color: #5B6085; border-bottom: 1px solid #E4E6F2">Demo with sample data</p>

<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto">
<header style="flex: none; height: 56px; display: flex; align-items: center"><h1 style="margin: 0; font-family: Sora, Inter, sans-serif; font-weight: 300; font-size: 28px; line-height: 34px; letter-spacing: -0.01em">Medications</h1></header>
<div role="radiogroup" aria-label="Medication list" style="flex: none; display: flex; gap: 4px; padding: 4px; background: #FFFFFF; border: 1px solid #DCDFF0; border-radius: 18px">
<sc-for list="{{tabs}}" as="f" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{f.checked}}" onClick="{{f.pick}}" style="flex: 1; height: 40px; border: 0; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{f.bg}}; color: {{f.fg}}">{{f.label}}</button>
</sc-for>
</div>
<div style="flex: none; background: #FFFFFF; border: 1px solid #E1E4F2; border-radius: 24px; padding: 2px 18px">
<sc-for list="{{rows}}" as="m" hint-placeholder-count="4">
<a href="{{m.href}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; box-sizing: border-box; padding: 8px 0; border-bottom: 1px solid {{m.divider}}; color: #14163A; text-decoration: none">
<span style="display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 22px; font-weight: 500">{{m.name}}</span><span style="font-size: 14px; line-height: 20px; color: #5B6085">{{m.sub}}</span></span>
<span style="flex: none; display: flex; align-items: center; gap: 6px"><span style="font-family: Sora, Inter, sans-serif; font-weight: 300; font-size: 22px; line-height: 28px">{{m.strength}}</span><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: {{m.chev}}"><path d="M9 5l7 7-7 7"/></svg></span>
</a>
</sc-for>
</div>
<a href="#top" style="display: flex; align-items: center; gap: 8px; height: 44px; color: {{accent}}; font-size: 15px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add a medication</a>
</main>
<nav aria-label="Main" style="flex: none; height: 68px; display: flex; align-items: center; border-top: 1px solid #E4E6F2; background: #FFFFFF">
<a href="MainA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>
Home
</a>
<a href="RecordA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>
Record
</a>
<a href="#top" aria-label="Add" style="flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none">
<span style="width: 48px; height: 48px; border-radius: 24px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
</a>
<a href="MedsA2.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{accent}}; font-size: 12px; line-height: 16px; font-weight: 600; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7Z"/><path d="M8.5 8.5l7 7"/></svg>
Medications
</a>
<a href="InsuranceA2.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #5B6085; font-size: 12px; line-height: 16px; font-weight: 500; text-decoration: none">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.8-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>
Profile
</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5468D4","options":["#5468D4","#4353C4","#6B5BD6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'current' }; }
  renderVals() {
    const accent = this.props.accent ?? '#5468D4';
    const cur = this.state.tab;
    const tabs = [['current', 'Current'], ['past', 'Past']].map((d) => {
      const on = cur === d[0];
      return { label: d[1], checked: on, bg: on ? accent : 'transparent', fg: on ? '#FFFFFF' : '#4A4F7A', pick: () => this.setState({ tab: d[0] }) };
    });
    const current = [
      ['Concerta', 'Morning, 5 strength changes', '36mg', 'MedDetailA2.dc.html'],
      ['Levothyroxine', 'Morning', '50mcg', '#top'],
      ['Warfarin', 'Evening, 8 days left', '5mg', '#top'],
      ['Salbutamol', 'As needed', '100mcg', '#top']
    ];
    const past = [
      ['Doxycycline', '2 Aug to 9 Aug 2026, Dr Hennessy', '100mg'],
      ['Prednisolone', '9 Feb to 14 Feb 2026, Dr Hennessy', '20mg'],
      ['Nitrofurantoin', '12 Sep to 17 Sep 2025, Dr Hennessy', '100mg'],
      ['Cetirizine', '1 Apr to 30 Sep 2024, Dr Hennessy', '10mg']
    ];
    const src = cur === 'current' ? current : past;
    const rows = src.map((r, i) => ({
      name: r[0], sub: r[1], strength: r[2], href: r[3] || '#top',
      chev: (r[3] && r[3] !== '#top') ? 'block' : 'none',
      divider: i === src.length - 1 ? 'transparent' : '#ECEEF8'
    }));
    return { accent: accent, tabs: tabs, rows: rows };
  }
}
</script>
</body>
</html>
