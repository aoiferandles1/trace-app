</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#5468D4","options":["#5468D4","#4353C4","#6B5BD6"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cond: true, visits: true, timeline: false, care: true, mental: false, notes: true, duration: '30' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#5468D4';
    const s = this.state;
    const tile = (key) => {
      const on = !!s[key];
      return {
        checked: on,
        bg: on ? accent : '#FFFFFF',
        border: on ? accent : '#DCDFF0',
        bs: key === 'mental' && !on ? 'dashed' : 'solid',
        fg: on ? '#FFFFFF' : '#14163A',
        iconFg: on ? '#FFFFFF' : '#3D4EB8',
        indBorder: on ? '#FFFFFF' : '#9096BE',
        indBg: on ? '#FFFFFF' : 'transparent',
        checkColor: on ? accent : 'transparent',
        toggle: () => this.setState({ [key]: !this.state[key] })
      };
    };
    const cond = tile('cond');
    const visits = tile('visits');
    const timeline = tile('timeline');
    const care = tile('care');
    const mental = tile('mental');
    const nOn = !!s.notes;
    const notes = {
      checked: nOn,
      trackBg: nOn ? accent : '#FFFFFF',
      trackBorder: nOn ? accent : '#7B80A8',
      knobBg: nOn ? '#FFFFFF' : '#7B80A8',
      knobLeft: nOn ? 24 : 4,
      toggle: () => this.setState({ notes: !this.state.notes })
    };
    const opts = [['30', '30 min'], ['60', '1 hour'], ['day', 'All day'], ['manual', 'Manual']];
    const durations = opts.map((o) => {
      const on = s.duration === o[0];
      return {
        label: o[1], checked: on,
        bg: on ? accent : 'transparent',
        fg: on ? '#FFFFFF' : '#4A4F7A',
        pick: () => this.setState({ duration: o[0] })
      };
    });
    const flags = [true, true, !!s.cond, !!s.visits, !!s.timeline, !!s.care, !!s.mental];
    const count = flags.filter((f) => f).length;
    return {
      accent: accent,
      cond: cond, visits: visits, timeline: timeline, care: care, mental: mental,
      notes: notes,
      durations: durations,
      bars: flags.map((f) => ({ bg: f ? accent : '#DCDFF0' })),
      countText: count + ' of 7 shared'
    };
  }
}
</script>
